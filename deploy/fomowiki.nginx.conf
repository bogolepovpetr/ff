# Copy to VPS, e.g.:
#   sudo cp deploy/fomowiki.nginx.conf /etc/nginx/sites-available/fomowiki
#   sudo ln -sf /etc/nginx/sites-available/fomowiki /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS по IP Let's Encrypt не выдаёт — когда будет домен, замените server_name и:
#   sudo certbot --nginx -d your.domain

server {
    listen 80;
    listen [::]:80;
    server_name 176.117.69.231;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
