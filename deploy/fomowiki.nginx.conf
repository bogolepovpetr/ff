# Copy to VPS, e.g.:
#   sudo cp deploy/fomowiki.nginx.conf /etc/nginx/sites-available/fomowiki
#   sudo ln -sf /etc/nginx/sites-available/fomowiki /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Static site: served directly from the committed `dist/` build, no Node
# process / reverse proxy needed. Rebuild with `npm run build` and `git pull`
# on the server (see scripts/update-from-git.sh), then nginx picks up the
# new files immediately (no reload required for content changes).
#
# HTTPS по IP Let's Encrypt не выдаёт — когда будет домен, замените server_name и:
#   sudo certbot --nginx -d your.domain

server {
    listen 80;
    listen [::]:80;
    server_name 176.117.69.231;

    root /var/www/fomowiki/dist;
    index index.html;

    # --- Legacy URL scheme (pre-Astro-migration) ---
    # Old Next.js i18n prefixed both locales (/en/..., /ru/...); the new
    # Astro scheme leaves `en` unprefixed and only prefixes `ru`. Drop a
    # leftover /en/ prefix so old bookmarks/links still resolve.
    rewrite ^/en/?$ / permanent;
    rewrite ^/en/(.*)$ /$1 permanent;

    # Old next.config.ts redirects() rules, reimplemented at the nginx
    # level (one block per locale since Astro no longer has a :lang param).
    rewrite ^/vip/?$ /deals/vip permanent;
    rewrite ^/vip/(.*)$ /deals/vip/$1 permanent;
    rewrite ^/dawn-fund/?$ /deals/dawn-fund permanent;
    rewrite ^/fomopass(?:/.*)?$ /deals permanent;

    rewrite ^/ru/vip/?$ /ru/deals/vip permanent;
    rewrite ^/ru/vip/(.*)$ /ru/deals/vip/$1 permanent;
    rewrite ^/ru/dawn-fund/?$ /ru/deals/dawn-fund permanent;
    rewrite ^/ru/fomopass(?:/.*)?$ /ru/deals permanent;

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml image/x-icon;
}
